name: Verify public AI Lab distribution

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-current-public-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Download and verify the current reviewed public ZIP
        run: node apps/ai-lab-landing/scripts/verify-public-distribution.cjs
