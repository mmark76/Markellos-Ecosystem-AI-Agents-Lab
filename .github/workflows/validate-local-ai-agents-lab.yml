name: Validate Local AI Agents Lab

on:
  pull_request:
    paths:
      - 'apps/local-ai-agents-lab/**'
      - '.github/workflows/validate-local-ai-agents-lab.yml'
  push:
    branches: [main]
    paths:
      - 'apps/local-ai-agents-lab/**'
      - '.github/workflows/validate-local-ai-agents-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-lab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/local-ai-agents-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python tests
        run: python -m unittest discover -s tests -v
      - name: Python syntax
        run: python -c "import ast,pathlib;ast.parse(pathlib.Path('server.py').read_text(encoding='utf-8'))"
      - name: JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/settings.js
          node --check static/ecosystem-shell.js
      - name: Test release builder
        run: |
          node --check scripts/build-release.cjs
          node --check scripts/verify-release.cjs
          node --test tests/build-release.test.cjs
      - name: Build release from tested Git commit
        run: node scripts/build-release.cjs HEAD "$RUNNER_TEMP/local-lab-release"
      - name: Verify stamped release
        run: node scripts/verify-release.cjs "$RUNNER_TEMP/local-lab-release/local-ai-agents-lab" "$GITHUB_SHA"
      - name: Publish local release artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: local-ai-agents-lab-${{ github.sha }}
          path: ${{ runner.temp }}/local-lab-release/local-ai-agents-lab/
          if-no-files-found: error
          retention-days: 30
      - name: Validate local-only boundaries
        run: |
          python -c "from pathlib import Path; p=Path('.'); assert not (p/'data').exists(); assert not (p/'backups').exists(); assert not list(p.rglob('*.sqlite3'))"
